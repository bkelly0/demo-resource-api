version: '3.8'

services:
  demo-auth-resource:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demo-auth-resource
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
