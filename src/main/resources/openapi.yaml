openapi: 3.0.3
info:
  title: Demo Auth Resource API
  version: 1.0.0
  description: Simple Protected Resource API with two endpoints returning user data

security:
  - BearerAuth: []

paths:
  /api/a/v1:
    get:
      summary: Get data from API A
      tags:
        - API A
      security:
        - OAuth2: [read:resource]
      description: |
        Requires scope `read:resource` and role `read:api:a`.
      x-required-roles:
        - read:api:a
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectedResourceResponse'
        '401': { description: Unauthorized }
        '403': { description: Forbidden }

  /api/b/v1:
    get:
      summary: Get data from API B
      tags:
        - API B
      security:
        - OAuth2: [read:resource]
      description: |
        Requires scope `read:resource` and role `read:api:b`.
      x-required-roles:
        - read:api:b
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectedResourceResponse'
        '401': { description: Unauthorized }
        '403': { description: Forbidden }

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://YOUR_ISSUER/oauth/token
          scopes:
            read:resource: Read protected resource data
  schemas:
    ProtectedResourceResponse:
      type: object
      required:
        - username
        - message
        - date
      properties:
        username:
          type: string
          example: johndoe
        message:
          type: string
          example: 'This is a protected resource'
        date:
          type: string
          format: date-time
          example: '2026-08-03T11:06:37Z'